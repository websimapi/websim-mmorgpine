<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMORPGine - MMORPG Game Engine</title>
    <link rel="icon" href="./assets/icon.png" type="image/png">
    <link rel="stylesheet" href="./css/style.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-overlay">
            <div id="editor-panel" class="panel hidden">
                <h2>Level Editor</h2>
                <div id="editor-tools"></div>
            </div>
            <div id="debug-panel" class="panel hidden">
                <h2>Debug</h2>
                <div id="debug-info"></div>
            </div>
            <div id="asset-panel" class="panel hidden">
                <h2>Asset Manager</h2>
                <div id="asset-tools"></div>
            </div>
            
            <!-- Control Panel with Buttons instead of F-keys -->
            <div id="control-panel">
                <div id="debug-button" class="control-button">Debug</div>
                <div id="editor-button" class="control-button">Editor</div>
                <div id="asset-button" class="control-button">Assets</div>
            </div>
        </div>
    </div>

    <!-- Core Engine Scripts -->
    <script type="module" src="./js/engine/core/Engine.js"></script>
    <script type="module" src="./js/main.js"></script>

</body>
</html>
